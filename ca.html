<!DOCTYPE html><html><head>
<title>Đăng ký ca – Mirafilm</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#520A0A">
<script>
(function(){
var EXEC='https://script.google.com/macros/s/AKfycbwlFXcjLfOWkJnCVFGAfjIC0S4kvj90G1Ccx32zXA0B_UViWO_xqvpFQU_FyQSAQokzHg/exec';
function call(fn,args,ok,fail){
  var tries=0;
  (function go(){
    fetch(EXEC+'?api=1',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){return r.json()})
    .then(function(j){if(j.ok){ok&&ok(j.d)}else{fail&&fail(new Error(j.err||'Lỗi'))}})
    .catch(function(e){if(++tries<3)return setTimeout(go,800*tries);fail&&fail(new Error('Mất kết nối – vui lòng thử lại'))});
  })();
}
function mk(ok,fail){return new Proxy({},{get:function(_,k){
  if(k==='withSuccessHandler')return function(f){return mk(f,fail)};
  if(k==='withFailureHandler')return function(f){return mk(ok,f)};
  return function(){call(k,[].slice.call(arguments),ok,fail)};
}})}
window.google={script:{
  run:mk(null,null),
  url:{getLocation:function(cb){var p={};new URLSearchParams(location.search).forEach(function(v,k){p[k]=v});cb({parameter:p,hash:location.hash.slice(1)})}},
  history:{replace:function(s,params){try{history.replaceState(null,'',location.pathname+'?'+new URLSearchParams(params||{}).toString())}catch(e){}}}
}};
})();
</script>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--do:#520A0A;--be:#E9E6D7;--nen:#f6f4ee;--chu:#1d1b16;--mo:#6b665c;--vien:#e2ded2;--xanh:#137333;--dov:#a50e0e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--nen);color:var(--chu);font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}
.top{background:var(--do);color:var(--be);padding:16px 14px 14px;text-align:center}
.top h1{margin:0;font-size:17px;letter-spacing:.06em;text-transform:uppercase}.top .cn{display:inline-block;margin-top:8px;border:1px solid rgba(233,230,215,.5);border-radius:99px;padding:3px 12px;font-size:13px}
.card{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:14px;margin-top:14px}
h2{font-size:15px;margin:0 0 10px}.lbl{font-size:13px;color:var(--mo);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.pick{border:1px solid var(--vien);background:#fff;border-radius:99px;padding:8px 14px;font:inherit;cursor:pointer}.pick.on{background:var(--do);color:#fff;border-color:var(--do)}
input{font:inherit;font-size:18px;letter-spacing:.3em;padding:10px 12px;border:1px solid var(--vien);border-radius:10px;width:160px;text-align:center}
.b1{background:var(--do);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}.b2{background:#fff;border:1px solid var(--vien);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.err{color:var(--dov);font-size:14px;min-height:18px;margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px}.tab{white-space:nowrap;border:1px solid var(--vien);background:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.tab.on{background:var(--chu);color:#fff;border-color:var(--chu)}
.tt{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;background:#e6f4ea;color:var(--xanh)}.tt.het{background:#fdecea;color:var(--dov)}.tt.chua{background:#eee;color:var(--mo)}
.day{background:#fff;border:1px solid var(--vien);border-radius:14px;margin-top:12px;overflow:hidden}.day.qua{opacity:.55}
.dh{padding:9px 12px;font-weight:700;background:#faf8f2;border-bottom:1px solid var(--vien);font-size:14px}.dh.cuoi{color:var(--dov)}
.ca{padding:10px 12px;border-top:1px solid #f0ede4;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}.ca:first-of-type{border-top:0}
.cat{font-size:13px;color:var(--mo)}.cat b{color:var(--chu);font-size:14px}
.dem{font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px}.dem.du{background:#e6f4ea;color:var(--xanh)}.dem.thieu{background:#fdecea;color:var(--dov)}
.ds{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;min-height:6px}
.nm{border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;border:1.5px dashed transparent;cursor:default}
.nm.dk{border-style:dashed}.nm.nghi{background:#eee!important;color:#888!important;text-decoration:line-through;border-color:#ccc!important}
.nm.ql{cursor:pointer}.gc{grid-column:1/-1;font-size:12px;color:var(--mo);font-style:italic}
.act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.mini{padding:6px 12px;font-size:13px;border-radius:99px}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mo);margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.sheet .chips{margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:10;max-width:90%}
.luoi{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;background:#fff;border:1px solid var(--vien);border-radius:14px;overflow:hidden;table-layout:fixed}.luoi th{background:var(--do);color:var(--be);font-size:12px;padding:7px 4px;font-weight:600}.luoi th:first-child{width:62px}.luoi td{border-top:1px solid #f0ede4;border-left:1px solid #f0ede4;padding:5px 4px;vertical-align:middle;text-align:center}.luoi td:first-child{border-left:0;font-size:12px;font-weight:700;text-align:left;padding-left:8px;background:#faf8f2}.luoi td.cuoi{color:var(--dov)}.luoi td.hom{background:#fff3bf}.luoi td.thieu{background:#fdf1f0}.luoi .nm{display:inline-block;font-size:11px;padding:2px 6px;margin:1px;font-weight:600;white-space:nowrap}.luoi .trong{color:var(--dov);font-weight:700}.luoi td.qua{opacity:.45}
.cnh{color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px 12px 0 0;margin-top:14px;letter-spacing:.03em}.cnh+.luoi{margin-top:0;border-radius:0 0 14px 14px}
.luoi td.le{background:#f3e8ff!important;color:#6b21a8}.lele{display:block;font-size:10px;font-weight:700;color:#6b21a8;margin-top:2px}.dh.le{background:#f3e8ff;color:#6b21a8}.leb{display:inline-block;margin-left:8px;font-size:12px;background:#6b21a8;color:#fff;border-radius:99px;padding:2px 8px}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--vien);border-radius:10px;padding:8px;min-height:60px}
</style></head><body><div class="top"><h1>Đăng ký ca</h1><div class="cn" id="tenCN">Mirafilm</div></div><div class="wrap" id="app"><div class="card">Đang tải…</div></div>
<script>
var P={},QL=false,INFO=null,ME=null,TUAN='',DATA=null,MAU={},CNX='',ORD=['CN1','CN2','CN3'],CNMAU={CN1:'#3a3a3a',CN2:'#8b1a1a',CN3:'#c56a00'};
var PAL=[['#f8d7da','#842029'],['#ffe5cc','#8a4b08'],['#fff3bf','#7a5d00'],['#d3f9d8','#1b5e20'],['#d0ebff','#0b4f8a'],['#e5dbff','#4b2a8f'],['#ffdeeb','#8a1c4a'],['#c3fae8','#0b6b52'],['#e9ecef','#343a40'],['#fde2c8','#7c3a00'],['#d8f5a2','#3d6b00'],['#bac8ff','#2b3a8f'],['#ffc9c9','#8a1111'],['#99e9f2','#0b5f6b'],['#eebefa','#6b1f7a'],['#ffd8a8','#7a4100'],['#b2f2bb','#1e6b2e'],['#a5d8ff','#114a7a'],['#fcc2d7','#7a1640'],['#ced4da','#212529'],['#ffec99','#6b5300'],['#d0bfff','#3f2a8a'],['#c5f6fa','#0b5f6b'],['#ffe3e3','#7a1111'],['#e6fcf5','#0b5f4a'],['#fff0f6','#7a1640'],['#f3f0ff','#3f2a8a']];
function $(i){return document.getElementById(i)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function q(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function api(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){if(fail)fail(e);else toast(e.message||e)});r[fn].apply(r,args)}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}
function mau(t){return MAU[t]||PAL[PAL.length-1]}
function KEY(){return 'dk3'+(QL?'_ql':'')}
function cnCua(t){var x=(INFO.nv.filter(function(n){return n.ten===t})[0]||{}).cns;return x||[]}
google.script.url.getLocation(function(l){P=l.parameter||{};QL=P.ql==='1';CNX=(P.cn||'').toUpperCase();
  var INFO0=/*INFO*/null;var go=function(i){INFO=i;i.nv.forEach(function(n,k){MAU[n.ten]=PAL[k%PAL.length]});TUAN=(i.tuan[1]||i.tuan[0]).d;$('tenCN').textContent='Mirafilm · 3 chi nhánh';var sv=ls(KEY());if(sv){ME=sv;tai()}else dangNhap()};if(INFO0)go(INFO0);else api('dkThongTin3',[],go)});
var TEN='';
function dangNhap(loi){ME=null;var h='<div class="card">';
  if(QL)h+='<h2>Quản lý – nhập mã</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••••">';
  else h+='<h2>Bạn là ai?</h2><div class="chips" id="dsTen">'+INFO.nv.map(function(n){var m=mau(n.ten);return '<button class="pick" style="background:'+m[0]+';color:'+m[1]+';border-color:'+m[0]+'" onclick="chonTen(this,\''+q(n.ten)+'\')">'+esc(n.ten)+'</button>'}).join('')+'</div><div class="lbl" style="margin-top:14px">Mã PIN 4 số của bạn (dùng chung cả 3 chi nhánh – hỏi quản lý nếu chưa có)</div><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">';
  h+='<div style="margin-top:14px"><button class="b1" onclick="vao()">Vào</button></div><div class="err" id="err">'+esc(loi||'')+'</div></div>';$('app').innerHTML=h}
function chonTen(b,t){TEN=t;[].forEach.call(document.querySelectorAll('#dsTen .pick'),function(e){e.style.outline=''});b.style.outline='3px solid var(--chu)';$('pin').focus()}
function vao(){var pin=$('pin').value.trim();if(!QL&&!TEN){$('err').textContent='Chọn tên của bạn trước';return}ME={ten:QL?'':TEN,pin:pin};tai()}
function tai(){api('dkTuan3',[TUAN,ME.ten,ME.pin,QL],function(d){ls(KEY(),ME);ve(d)},function(e){ls(KEY(),null);dangNhap(e.message||e)})}
function chip(x){var m=mau(x.ten),cls='nm',pre='';if(x.tt==='ĐK')cls+=' dk';if(x.tt==='XẾP')pre='✓';if(x.tt==='XOAY GẤP')pre='⚡';if(x.tt==='ĐỔI/NGHỈ')cls+=' nghi';
  var st=x.tt==='ĐK'?'background:'+m[0]+';border-color:'+m[1]+';color:'+m[1]:x.tt==='ĐỔI/NGHỈ'?'':'background:'+m[1]+';color:#fff;border-color:'+m[1];
  if(x.trung){pre=(x.tl==='do'?'⚠':'')+pre;st+=';box-shadow:0 0 0 2px '+(x.tl==='do'?'var(--dov)':'#f2b400')}if(!QL&&x.ten===ME.ten)st+=';outline:2px solid var(--chu)';return {cls:cls,st:st,txt:pre+(pre?' ':'')+esc(x.ten),tip:x.trung?' title="Trùng: '+esc(x.trung)+'"':''}}
function chipH(x){var c=chip(x);return '<span class="'+c.cls+'" style="'+c.st+'"'+c.tip+'>'+c.txt+'</span>'}
function hk(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function luoi(cn,cd){var t='<div class="cnh" style="background:'+CNMAU[cn]+'">'+esc(INFO.ten[cn])+'</div><table class="luoi"><tr><th>Ngày</th><th>Ca 1</th><th>Ca 2</th><th>Ca 3</th></tr>';
  cd.ngay.forEach(function(n){var cuoi=/^(T7|CN)/.test(n.nhan);t+='<tr><td class="'+(cuoi?'cuoi':'')+(n.d===hk()?' hom':'')+(n.qua?' qua':'')+(n.le?' le':'')+'"'+(n.le?' title="'+esc(n.le.ten)+'"':'')+'>'+esc(n.nhan).replace(' ','<br>')+(n.le?'<span class="lele">🎉 '+esc(n.le.loai)+(n.le.loai==='Lễ'?' ×3':' ×2')+'</span>':'')+'</td>';
    n.ca.forEach(function(c){var co=c.ds.filter(function(x){return x.tt!=='ĐỔI/NGHỈ'}).length;t+='<td class="'+(co<c.dm&&!n.qua?'thieu':'')+(n.qua?' qua':'')+'">'+(c.ds.length?c.ds.map(chipH).join(''):'<span class="trong">—</span>')+'</td>'});t+='</tr>'});
  return t+'</table>'}
function ve(d){DATA=d;TUAN=d.tuan;var cua=QL?ORD:cnCua(ME.ten);if(!CNX||cua.indexOf(CNX)<0)CNX=cua[0]||'CN1';
  var h='<div class="bar"><span>'+(QL?'<b>Chế độ quản lý</b>':'Xin chào <b>'+esc(ME.ten)+'</b> · '+esc(cua.join(', ')))+'</span><button class="b2 mini" onclick="ls(KEY(),null);TEN=\'\';dangNhap()">Đổi người</button></div>';
  h+='<div class="tabs">'+INFO.tuan.map(function(t){return '<button class="tab'+(t.d===d.tuan?' on':'')+'" onclick="TUAN=\''+t.d+'\';tai()">'+esc(t.nhan)+'</button>'}).join('')+'</div>';
  h+='<div class="tt'+(!d.mo?' chua':d.conHan?'':' het')+'">'+esc(d.tt)+'</div>';
  var tr=QL?d.trung:d.trung.filter(function(x){return x.ten===ME.ten});
  var trD=tr.filter(function(x){return x.muc==='do'}),trV=tr.filter(function(x){return x.muc!=='do'});var dong1=function(x){return '<br>• '+esc(x.ten)+' – '+esc(x.ngay)+' '+esc(x.ca)+': '+esc(x.o)};
  if(trD.length)h+='<div class="tt het" style="font-weight:500"><b>⚠ XẾP TRÙNG CA – phải sửa ('+trD.length+')</b>'+trD.map(dong1).join('')+'</div>';
  if(trV.length)h+='<div class="tt" style="font-weight:500;background:#fef7e0;color:#7a4a00"><b>Đăng ký cùng ca ở 2 chi nhánh – quản lý chọn 1 ('+trV.length+')</b>'+trV.map(dong1).join('')+'</div>';
  h+='<div class="leg"><span><span class="nm dk" style="background:#eee;border-color:#555;color:#555">Tên</span> đã đăng ký</span><span><span class="nm" style="background:#555;color:#fff">✓ Tên</span> được xếp</span><span><span class="nm" style="background:#555;color:#fff">⚡ Tên</span> xoay gấp</span><span><span class="nm nghi">Tên</span> đổi/nghỉ</span></div>';
  var thu=QL?ORD:cua.concat(ORD.filter(function(x){return cua.indexOf(x)<0}));
  thu.forEach(function(cn){h+=luoi(cn,d.cns[cn])});
  h+='<div class="lbl" style="margin-top:6px">Ô hồng = chưa đủ định mức.</div>';
  h+='<h2 style="margin-top:22px">'+(QL?'Chỉnh lịch theo chi nhánh':'Đăng ký ca')+'</h2><div class="tabs">'+cua.map(function(cn){return '<button class="tab'+(cn===CNX?' on':'')+'" onclick="CNX=\''+cn+'\';ve(DATA)">'+esc(INFO.ten[cn])+'</button>'}).join('')+'</div>';
  if(!cua.length)h+='<div class="card">Bạn chưa có tên ở chi nhánh nào – nhắn quản lý.</div>';
  else d.cns[CNX].ngay.forEach(function(n){var cuoi=/^(T7|CN)/.test(n.nhan);h+='<div class="day'+(n.qua?' qua':'')+'"><div class="dh'+(cuoi?' cuoi':'')+(n.le?' le':'')+'">'+esc(n.nhan)+(n.le?'<span class="leb">🎉 '+esc(n.le.loai)+(n.le.ten?' · '+esc(n.le.ten):'')+' – lương '+(n.le.loai==='Lễ'?'×3':'×2')+'</span>':'')+'</div>';
    n.ca.forEach(function(c){var co=c.ds.filter(function(x){return x.tt!=='ĐỔI/NGHỈ'}).length,cuaToi=null;
      h+='<div class="ca"><div class="cat"><b>'+esc(c.ca)+'</b> · '+esc(c.gio)+'</div><span class="dem '+(co>=c.dm?'du':'thieu')+'">'+co+'/'+c.dm+'</span><div class="ds">';
      c.ds.forEach(function(x){var k=chip(x);if(!QL&&x.ten===ME.ten)cuaToi=x.tt;h+='<span class="'+k.cls+(QL?' ql':'')+'" style="'+k.st+'"'+k.tip+(QL?' onclick="menu(\''+CNX+'\','+c.r+',\''+q(x.ten)+'\',\''+x.tt+'\')"':'')+'>'+k.txt+'</span>'});
      h+='</div>';if(c.gc)h+='<div class="gc">📝 '+esc(c.gc)+'</div>';
      if(!n.qua){if(QL)h+='<div class="act"><button class="b2 mini" onclick="them(\''+CNX+'\','+c.r+')">+ Thêm người</button><button class="b2 mini" onclick="ghi(\''+CNX+'\','+c.r+')">📝 Ghi chú</button></div>';
        else if(d.mo){if(!cuaToi)h+='<div class="act"><button class="b1 mini" onclick="bam(\''+CNX+'\','+c.r+',this)">+ Đăng ký ca này</button></div>';else if(cuaToi==='ĐK')h+='<div class="act"><button class="b2 mini" onclick="bam(\''+CNX+'\','+c.r+',this)">Bỏ đăng ký</button></div>'}}
      h+='</div>'});h+='</div>'});
  var y=window.scrollY;$('app').innerHTML=h;window.scrollTo(0,y)}
function bam(cn,r,b){b.disabled=true;b.textContent='Đang lưu…';api('dkBam',[cn,r,ME.ten,ME.pin],function(d){ve(d);if(d.trung.some(function(x){return x.ten===ME.ten}))toast('Bạn đang đăng ký cùng ca ở 2 chi nhánh – quản lý sẽ chọn 1 nơi')},function(e){toast(e.message||e);tai()})}
function dong(){var s=document.querySelector('.sheet');if(s)s.remove()}
function sheet(h){dong();var d=document.createElement('div');d.className='sheet';d.onclick=function(e){if(e.target===d)dong()};d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function caOf(cn,r){var c=null;DATA.cns[cn].ngay.forEach(function(n){n.ca.forEach(function(x){if(x.r===r)c=x})});return c}
function menu(cn,r,t,tt){var o=[['XẾP','✓ Xếp'],['ĐK','Chỉ đăng ký'],['XOAY GẤP','⚡ Xoay gấp'],['ĐỔI/NGHỈ','Đổi / nghỉ'],['','✕ Xoá khỏi ca']];
  sheet('<h2>'+esc(t)+' · '+cn+'</h2><div class="lbl">Đang: '+esc(tt)+'</div><div class="chips">'+o.map(function(x){return '<button class="pick'+(x[0]===tt?' on':'')+'" onclick="dat(\''+cn+'\','+r+',\''+q(t)+'\',\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>')}
function dat(cn,r,t,tt){dong();toast('Đang lưu…');api('dkQL',[cn,r,t,tt,ME.pin],ve)}
function them(cn,r){var c=caOf(cn,r),co={};c.ds.forEach(function(x){co[x.ten]=1});
  sheet('<h2>Thêm người vào ca (xoay gấp) · '+cn+'</h2><div class="chips">'+DATA.cns[cn].nv.filter(function(t){return !co[t]}).map(function(t){var m=mau(t);return '<button class="pick" style="background:'+m[0]+';color:'+m[1]+';border-color:'+m[0]+'" onclick="dat(\''+cn+'\','+r+',\''+q(t)+'\',\'XOAY GẤP\')">'+esc(t)+'</button>'}).join('')+'</div>')}
function ghi(cn,r){var c=caOf(cn,r);sheet('<h2>Ghi chú ca · '+cn+'</h2><textarea id="gcTxt" placeholder="VD: Vi nghỉ → Giàu thay; Bích +30p">'+esc(c.gc)+'</textarea><div style="margin-top:10px"><button class="b1" onclick="luuGhi(\''+cn+'\','+r+')">Lưu</button></div>')}
function luuGhi(cn,r){var v=$('gcTxt').value;dong();toast('Đang lưu…');api('dkGhi',[cn,r,v,ME.pin],ve)}
</script></body></html>
