function call(fn,args,ok,fail){
  var tries=0;
  (function go(){
    fetch(EXEC+'?api=1',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})

function mk(ok,fail){return new Proxy({},{get:function(_,k){

}})}

<style>
:root{--nau:#520A0A;--be:#dcd2bd;--nen:#520A0A;--the:#E9E6D7;--chu:#2b1414;--mo:#7d6f66;--do:#a3241b;--xanh:#1e7a3c;--cam:#c9741f;--vien:#d9cfbb}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font-family:'Inter',system-ui,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
.wide{max-width:1280px}
.logo{display:flex;flex-direction:column;align-items:center;margin:6px 0 0}
.logo i,.serif{font-family:'STIX Two Text',Georgia,'Times New Roman',serif}
.logo i{display:block;font-style:normal;font-weight:700;font-size:28px;letter-spacing:.28em;padding-left:.3em;color:var(--nau)}
.logo span{font-size:10px;letter-spacing:.55em;padding-left:.55em;color:var(--nau);font-weight:700;margin-top:6px}
.logo.sm{align-items:flex-start}.logo.sm i{font-size:18px}.logo.sm span{font-size:8px}
.sub{text-align:center;color:var(--mo);font-size:13.5px;line-height:1.5;margin:4px 0 18px}
.card{background:var(--the);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(82,10,10,.08);margin-bottom:14px}
h2{font-size:16px;font-weight:700;margin:0 0 12px;color:var(--nau)}
h3{font-size:14px;margin:14px 0 8px;color:var(--nau)}
label{display:block;font-size:13px;color:var(--mo);margin:12px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--vien);border-radius:10px;background:#fff}
input.code{font-size:28px;letter-spacing:.4em;text-align:center;font-weight:800;color:var(--nau)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{border:2px solid var(--vien);border-radius:12px;padding:12px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;background:#fff}
.room.on{border-color:var(--nau);background:var(--be)}
.room small{display:block;font-weight:400;color:var(--mo);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.sb{gap:12px}
.coc{border-left:4px solid var(--nau);border-radius:4px 10px 10px 4px;padding:10px 14px;margin:0 0 12px;font-weight:700;font-size:15px;color:var(--nau);background:#f1e4cf}
.coc small{display:block;font-weight:500;font-size:13px;color:var(--mo);margin-top:2px}
.gia{width:100%;border-collapse:collapse;background:transparent;font-size:14px;margin:2px 0 4px}
.gia td{padding:5px 2px;border-bottom:1px dotted #c9b9a1;color:#4a3a30;cursor:default}
.gia tr:last-child td{border-bottom:0}
.gia td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.chip{border:1.5px solid var(--vien);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;width:auto}
.chip.on{background:var(--nau);border-color:var(--nau);color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.slot{border:1.5px solid var(--vien);background:#fff;border-radius:9px;padding:9px 0;text-align:center;font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.slot.on{background:var(--nau);border-color:var(--nau);color:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;width:100%;cursor:pointer}
.b1{background:var(--nau);color:#fff}.b2{background:var(--be);color:var(--nau)}.b3{background:transparent;color:var(--do);text-decoration:underline;font-weight:600}
.bx{background:var(--xanh);color:#fff}
button:disabled{opacity:.5}
.err{color:var(--do);font-size:14px;margin-top:10px;min-height:18px}
.big{font-size:72px;font-weight:800;text-align:center;line-height:1;margin:6px 0;color:var(--nau);font-variant-numeric:tabular-nums}
.lbl{text-align:center;color:var(--mo);font-size:13px}
.state{text-align:center;font-size:20px;font-weight:700;margin:14px 0 4px}
.eta{text-align:center;margin-top:10px;font-size:15px}.eta b{color:var(--nau)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.kpi{text-align:center}.kpi b{display:block;font-size:30px}
.logo img{display:block;width:118px;max-width:36%;height:auto}
.tit{text-align:center;color:#E9E6D7;font-size:17px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;line-height:1.35;margin:24px 0 14px}
.cnp{text-align:center;margin:0 0 18px}.cnp span{display:inline-block;border:1px solid rgba(233,230,215,.38);border-radius:999px;padding:6px 16px;color:#E9E6D7;font-size:13.5px;font-weight:500;letter-spacing:.01em}
.tit.solo{margin-bottom:20px}.cnp{margin-bottom:22px}.logo.sm img{width:120px;max-width:none}
.bang{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bang .o{background:#fffdf8;border:1px solid var(--vien);border-radius:10px;padding:10px 8px;text-align:center}
.bang .o span{display:block;font-size:12px;color:var(--mo);font-weight:600}
.bang .o b{display:block;font-size:24px;line-height:1.35;color:var(--nau)}
.bang .o small{font-size:11.5px;color:var(--mo)}
.tk .big{margin:2px 0}
.tk{transition:background .3s}
.tk.sap{background:#fff1dc;box-shadow:0 0 0 3px var(--cam)}
.tk.den{background:#dff3e5;box-shadow:0 0 0 3px var(--xanh);animation:nhay 1s infinite}
@keyframes nhay{50%{box-shadow:0 0 0 9px var(--xanh)}}
.note{font-size:13px;color:var(--mo);text-align:center;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.list{font-size:13px;margin-top:10px;border-top:1px solid #eee5d6;padding-top:8px;max-height:300px;overflow:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px dashed #e2d6c3}
.li .inf{flex:1;min-width:0;line-height:1.5}
.li .l1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.li .l2{color:var(--mo);font-size:13px;margin-top:2px}
.li .bt .lbl{font-size:12px;white-space:nowrap;margin-right:4px}
@media(max-width:640px){.li{flex-direction:column;align-items:stretch;gap:8px}.li .bt{justify-content:flex-start}}
.li>span{min-width:0}
.li .bt{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini{width:auto;padding:6px 10px;font-size:12px}
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.nvh{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"b k x";align-items:center;gap:16px;margin-bottom:16px}
.nvb{grid-area:b;display:flex;align-items:center;gap:14px;min-width:0}
.nvh .logo{margin:0}.nvh .logo.sm img{width:96px}
.nvt{min-width:0}.nvt b{display:block;color:#E9E6D7;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nvt small{display:block;color:#d9c9b8;font-size:12.5px;margin-top:3px;white-space:nowrap}
.nvk{grid-area:k;display:grid;grid-template-columns:auto auto;gap:10px;align-items:stretch}
.nvh .mq{display:flex;flex-direction:column;justify-content:center;padding:6px 18px}.nvh .mq small{font-size:10.5px;letter-spacing:.06em}.nvh .mq b{font-size:28px;line-height:1.15}
.nvqr{width:auto;padding:0 18px;white-space:nowrap;font-size:14px}
.nvx{grid-area:x;width:auto;background:transparent;color:#d9c9b8;border:1px solid rgba(233,230,215,.35);padding:7px 14px;font-size:13px;font-weight:600;border-radius:8px;white-space:nowrap}
@media(max-width:700px){.wrap.wide{padding:12px 12px 80px}.nvh{grid-template-columns:1fr auto;grid-template-areas:"b x" "k k";gap:12px}.nvh .logo.sm img{width:60px}.nvb{gap:10px}.nvt b{font-size:14.5px}.nvt small{font-size:12px}.nvk{grid-template-columns:1fr 1fr}.nvh .mq{padding:8px 10px}.nvh .mq b{font-size:26px}.nvqr{padding:0 10px}.card{padding:14px;margin-bottom:12px}.grid{gap:12px}}
.pc h2{margin:0 0 12px}
.pc h3{font-size:12px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--mo)}
.st{display:grid;grid-template-columns:repeat(3,1fr);background:#fbf9f3;border:1px solid var(--vien);border-radius:10px;margin-bottom:12px}
.st>div{text-align:center;padding:8px 4px;min-width:0}.st>div+div{border-left:1px solid var(--vien)}
.st span{display:block;font-size:12px;color:var(--mo)}.st b{display:block;font-size:22px;line-height:1.3;color:var(--nau);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgk{font-size:13px;color:var(--mo);margin:-4px 0 10px;text-align:center}
.act{display:grid;grid-template-columns:2fr 1fr;gap:8px}.act button{padding:12px 8px}
.pc .list{border-top:0;padding-top:0;margin-top:0}
.mq{text-align:center;background:var(--nau);color:#fff;border-radius:12px;padding:8px 16px}
.mq small{display:block;font-size:11px;opacity:.8}.mq b{font-size:34px;letter-spacing:.25em;padding-left:.25em}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(43,10,10,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{max-width:440px;width:100%;text-align:center}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--be);color:var(--nau)}
.tag.cho_ck{background:#fff1dc;color:#8a4b0f}.tag.da_xn{background:#dff3e5;color:var(--xanh)}.tag.checkin,.tag.goi{background:#dbe8f7;color:#1f4e8a}
.tag.huy,.tag.het_han,.tag.khong_den{background:#eee;color:#777}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:10px 0}.kv span{color:var(--mo)}.kv b{min-width:0;overflow-wrap:anywhere}
.ck{background:#fff7e8;border:1px dashed var(--cam);border-radius:12px;padding:14px;margin-top:12px;text-align:center}
.ck img{max-width:240px;width:100%;border-radius:8px;background:#fff}
.copy{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.copy code{background:#fff;border:1px solid var(--vien);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:700;max-width:100%;overflow-wrap:anywhere;white-space:normal}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:14px;color:var(--chu)}.chk input{width:20px;height:20px;flex-shrink:0;margin:0}
.pol{font-size:12px;color:var(--mo);line-height:1.6;margin:8px 0 0;padding-left:18px}
.tre{color:var(--do);font-weight:700}
body{min-height:100vh}
.logo i,.logo span{color:#E9E6D7}.card .logo i,.card .logo span{color:var(--nau)}
.sub{color:#e6d3c3}.wrap>.note{color:#d9c9b8}.wrap .b3{color:#f3d9cf}.wrap>.err{color:#ffd2c8}.hdr .lbl{color:#e6d3c3}
.card{box-shadow:0 6px 24px rgba(0,0,0,.25)}.room,.chip,.slot,input{background:#fbf9f3}.mq{border:1px solid #E9E6D7}
.anh{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}.anh img{height:130px;width:auto;border-radius:10px;object-fit:cover;flex:0 0 auto;cursor:zoom-in;background:#ddd}
[hidden]{display:none!important}
.khoan{margin:12px 0;padding:12px 14px;border:2px solid #c0392b;background:#fdecea;color:#a50e0e;border-radius:12px;font-weight:800;font-size:16px;text-align:center;letter-spacing:.3px}.khoan span{display:block;font-weight:600;font-size:13px;margin-top:4px;letter-spacing:0}.chk2{background:#fff7e8;border:1.5px dashed #c0392b;border-radius:10px;padding:10px 12px;color:#7a1010}.chk2 input{width:20px;height:20px;accent-color:#a50e0e}.thu{color:#1f6b3a;font-size:12px}
</style></head>

  });
}
function nvChonCN(view){api('dlChiNhanh',[],function(ds){

})}
function api(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(fail||function(e){var x=$('err');if(x)x.textContent=e.message||e});r[fn].apply(r,args)}
function hom(){var d=new Date();d=new Date(d.getTime()+(d.getTimezoneOffset()+420)*60000);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function tien(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}

google.script.url.getLocation(function(loc){

  moForm();
});
