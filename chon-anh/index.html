<style>
:root{--nau:#520A0A;--the:#E9E6D7;--chu:#2b1414;--mo:#7d6f66;--do:#a3241b;--vien:#d9cfbb;--nen:#f7f4ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nen);color:var(--chu);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.app{position:relative;max-width:480px;margin:0 auto;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--nen)}
@supports(height:100dvh){.app{height:100dvh}}
.top{background:var(--nau);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top img{height:30px;display:block}
/* chon ngon ngu */
.nn{display:flex;gap:2px;background:rgba(233,230,215,.15);border-radius:999px;padding:2px;flex:none}
.nn button{border:0;background:transparent;color:var(--the);font:600 11px Inter,sans-serif;letter-spacing:.04em;padding:5px 9px;border-radius:999px;cursor:pointer}
.nn button.on{background:var(--the);color:var(--nau)}
.top h1{flex:1;text-align:right;margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--the);line-height:1.2}
.panel{flex:none;background:#fff;border-bottom:1px solid var(--vien);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;gap:2px;background:var(--the);border-radius:10px;padding:3px}
.seg button{min-height:34px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500;cursor:pointer}
.mini{position:relative;flex:none}
.mini .phong-khung{position:absolute;right:-6px;bottom:-6px;z-index:4;width:30px;height:30px;border-radius:15px;border:1px solid var(--vien);background:#fff;color:var(--nau);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.klon{position:absolute;inset:0;z-index:9;background:rgba(28,14,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.klon .lb{color:#d8cfc6}
.seg button.on{background:var(--nau);color:var(--the)}
.row{display:flex;gap:12px;align-items:stretch}
.frame{position:relative;flex:none;background:center/cover no-repeat;border-radius:2px;box-shadow:0 1px 3px rgba(43,20,20,.2)}
.slot{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}
.slot .in{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--nau);background:rgba(233,230,215,.9)}
.slot .in.r{border-radius:1px;border:1px solid rgba(82,10,10,.2)}
.slot.on{z-index:2}
.slot.on .in.r{border:2px solid var(--do);box-shadow:0 0 0 2px #fff}
.slot.on.sh{filter:drop-shadow(0 0 1px #a3241b) drop-shadow(0 0 1px #a3241b) drop-shadow(0 0 1px #a3241b)}
.slot img,.tile img,.zimg img{display:block;object-fit:cover}
.slot img{position:absolute;left:50%;top:50%}
.bw .ph{filter:grayscale(1)}
.chu{position:absolute;z-index:3;pointer-events:none}
.side{flex-grow:1;display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:space-between}
.lb{font-size:12px;color:var(--mo)}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--vien);background:#fff;color:var(--nau);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav .c{flex-grow:1;text-align:center;display:flex;flex-direction:column}
.nav .c b{font-size:17px;font-weight:600;color:var(--nau)}
.nav .c small{font-size:11px;color:var(--mo)}
.list{flex-grow:1;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.lh{display:flex;justify-content:space-between;align-items:baseline}
.lh b{font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;padding:0;border:0;background:#d8d0c2;cursor:pointer}
.tile img{width:100%;height:100%}
.tile.used{outline:3px solid var(--nau);outline-offset:-3px}
.tile .n{position:absolute;left:6px;bottom:5px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile .t{position:absolute;right:6px;top:6px;background:var(--nau);color:var(--the);font-size:11px;font-weight:500;border-radius:6px;padding:2px 6px}
.foot{flex:none;background:#fff;border-top:1px solid var(--vien);padding:8px 12px 12px;display:flex;gap:12px;align-items:center}
.foot .s{display:flex;flex-direction:column;flex-grow:1}
.foot .s b{font-size:15px;font-weight:500}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:0;font-size:15px;font-weight:500;cursor:pointer;background:var(--nau);color:var(--the)}
.btn[disabled]{cursor:default;background:var(--the);color:var(--mo)}
.btn.ghost{background:transparent;border:1px solid var(--nau);color:var(--nau)}
.msg{flex-grow:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.msg h2{margin:0;font-weight:600;font-size:24px;line-height:1.25}
.msg p{margin:0;font-size:15px;line-height:1.55;color:var(--mo)}
.box{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:4px 16px}
.box div{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #efe8da}
.box div:last-child{border-bottom:0}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hai .btn{padding:0 8px;white-space:nowrap}
.ghep{display:flex;flex-direction:column;align-items:center;gap:8px}
.ghep .g{display:flex;gap:12px;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - min(36%,130px))}
.ghep .g::-webkit-scrollbar{display:none}
.ghep .g.mot{justify-content:center;padding:0}
.ghep .g a{flex:0 0 min(72%,260px);scroll-snap-align:center;display:block;background:#fff;border-radius:6px;overflow:hidden;aspect-ratio:3/4;box-shadow:0 2px 10px rgba(28,14,14,.14)}
.ghep .g img{display:block;width:100%;height:100%;object-fit:cover}
.ghep .ch{display:flex;gap:6px}
.ghep .ch i{width:6px;height:6px;border-radius:3px;background:var(--vien)}
.ghep .ch i.on{background:var(--nau);width:16px}
.luu{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--the);font-size:13px;flex:none}
.luu span{flex:1;line-height:1.3}
.luu button{border:0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.luu .l{background:var(--nau);color:var(--the);padding:8px 12px}
.luu .x{background:transparent;color:var(--mo);width:32px;height:32px;font-size:18px;line-height:1}
.dl{font-size:12px;color:var(--do);font-weight:500}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--chu);color:var(--the);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.45;z-index:30;word-break:break-all}
.zoom{position:absolute;inset:0;z-index:10;background:#1c0e0e;color:var(--the);display:flex;flex-direction:column}
.zoom .h{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 20px}
.zoom .h button,.zoom .ar{width:44px;height:48px;border:0;border-radius:10px;background:rgba(28,14,14,.55);color:var(--the);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom .m{flex-grow:1;position:relative;display:flex;align-items:center;justify-content:center;padding:0 16px;min-height:0}
.zimg{max-width:100%;max-height:100%;border-radius:4px;overflow:hidden;background:#3a2a25}
.zimg{width:100%}.zimg img{width:100%;height:auto;max-height:calc(100vh - 200px);object-fit:contain;cursor:zoom-in}
#zimg{touch-action:none;position:relative}
#zimg img{transform-origin:0 0;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.zoom .m.phong .ar{opacity:.35}
.zoom .ar{position:absolute;top:50%;margin-top:-24px}
.zoom .f{padding:16px;display:flex;flex-direction:column;gap:8px}
.zoom .f span{font-size:13px;line-height:20px;color:#b9aea4;text-align:center;min-height:40px;white-space:pre-line;display:flex;align-items:center;justify-content:center}
.zoom .f .btn{min-height:52px;background:var(--the);color:var(--nau);font-size:16px}
.hide{display:none!important}
</style>
