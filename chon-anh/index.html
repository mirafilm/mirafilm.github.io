<style>
:root{--nau:#520A0A;--the:#E9E6D7;--chu:#2b1414;--mo:#7d6f66;--do:#a3241b;--vien:#d9cfbb;--nen:#f7f4ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nen);color:var(--chu);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.app{position:relative;max-width:480px;margin:0 auto;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--nen)}
@supports(height:100dvh){.app{height:100dvh}}
.top{background:var(--nau);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top img{height:30px;display:block}
.top h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--the);line-height:1.2}
.panel{flex:none;background:#fff;border-bottom:1px solid var(--vien);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;gap:2px;background:var(--the);border-radius:10px;padding:3px}
.seg button{min-height:34px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500;cursor:pointer}
.mini{position:relative;flex:none}
.mini .phong-khung{position:absolute;right:-6px;bottom:-6px;z-index:4;width:30px;height:30px;border-radius:15px;border:1px solid var(--vien);background:#fff;color:var(--nau);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.klon{position:absolute;inset:0;z-index:9;background:rgba(28,14,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.klon .lb{color:#d8cfc6}
.seg button.on{background:var(--nau);color:var(--the)}
.row{display:flex;gap:12px;align-items:stretch}
.frame{position:relative;flex:none;background:center/cover no-repeat;border-radius:2px;box-shadow:0 1px 3px rgba(43,20,20,.2)}
.slot{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}
.slot .in{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--nau);background:rgba(233,230,215,.9)}
.slot .in.r{border-radius:1px;border:1px solid rgba(82,10,10,.2)}
.slot.on{z-index:2}
.slot.on .in.r{border:2px solid var(--do);box-shadow:0 0 0 2px #fff}
.slot.on.sh{filter:drop-shadow(0 0 1px #a3241b) drop-shadow(0 0 1px #a3241b) drop-shadow(0 0 1px #a3241b)}
.slot img,.tile img,.zimg img{display:block;object-fit:cover}
.slot img{position:absolute;left:50%;top:50%}
.bw .ph{filter:grayscale(1)}
.chu{position:absolute;z-index:3;pointer-events:none}
.side{flex-grow:1;display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:space-between}
.lb{font-size:12px;color:var(--mo)}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--vien);background:#fff;color:var(--nau);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav .c{flex-grow:1;text-align:center;display:flex;flex-direction:column}
.nav .c b{font-family:'STIX Two Text',serif;font-size:19px;font-weight:600;color:var(--nau)}
.nav .c small{font-size:11px;color:var(--mo)}
.list{flex-grow:1;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.lh{display:flex;justify-content:space-between;align-items:baseline}
.lh b{font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;padding:0;border:0;background:#d8d0c2;cursor:pointer}
.tile img{width:100%;height:100%}
.tile.used{outline:3px solid var(--nau);outline-offset:-3px}
.tile .n{position:absolute;left:6px;bottom:5px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile .t{position:absolute;right:6px;top:6px;background:var(--nau);color:var(--the);font-size:11px;font-weight:500;border-radius:6px;padding:2px 6px}
.foot{flex:none;background:#fff;border-top:1px solid var(--vien);padding:8px 12px 12px;display:flex;gap:12px;align-items:center}
.foot .s{display:flex;flex-direction:column;flex-grow:1}
.foot .s b{font-size:15px;font-weight:500}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:0;font-size:15px;font-weight:500;cursor:pointer;background:var(--nau);color:var(--the)}
.btn[disabled]{cursor:default;background:var(--the);color:var(--mo)}
.btn.ghost{background:transparent;border:1px solid var(--nau);color:var(--nau)}
.msg{flex-grow:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.msg h2{margin:0;font-family:'STIX Two Text',serif;font-weight:600;font-size:28px;line-height:1.2}
.msg p{margin:0;font-size:15px;line-height:1.55;color:var(--mo)}
.box{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:4px 16px}
.box div{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #efe8da}
.box div:last-child{border-bottom:0}
.zoom{position:absolute;inset:0;z-index:10;background:#1c0e0e;color:var(--the);display:flex;flex-direction:column}
.zoom .h{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 20px}
.zoom .h button,.zoom .ar{width:44px;height:48px;border:0;border-radius:10px;background:rgba(28,14,14,.55);color:var(--the);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom .m{flex-grow:1;position:relative;display:flex;align-items:center;justify-content:center;padding:0 16px;min-height:0}
.zimg{max-width:100%;max-height:100%;border-radius:4px;overflow:hidden;background:#3a2a25}
.zimg{width:100%}.zimg img{width:100%;height:auto;max-height:calc(100vh - 200px);object-fit:contain;cursor:zoom-in}
#zimg{touch-action:none;position:relative}
#zimg img{transform-origin:0 0;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.zoom .m.phong .ar{opacity:.35}
.zoom .ar{position:absolute;top:50%;margin-top:-24px}
.zoom .f{padding:16px;display:flex;flex-direction:column;gap:8px}
.zoom .f span{font-size:13px;color:#b9aea4;text-align:center;min-height:18px}
.zoom .f .btn{min-height:52px;background:var(--the);color:var(--nau);font-size:16px}
.hide{display:none!important}
</style>
</head>

var KHUNG = {
  valentine: { ten: 'Valentine', bg: 'khung_valentine.jpg', o: [
    [36,35,158,234,'r'],[439,12,125,123,'r'],[439,142,125,123,'r'],[439,271,125,123,'r'],[439,401,125,123,'r'],
    [18.2,353.1,182.9,186.5,'h'],[231.1,353.5,182.9,186.5,'h'],[52,623,139,113,'r'],[236,623,139,113,'r']] },
  tapchi: { ten: 'Tạp chí', bg: 'khung_tapchi.jpg', chu: [20,20,280,170], o: [

};
var S = { f: '', demo: false, ten: '', anh: [], img: {}, khung: 'valentine', act: 0, gan: {}, bw: false, zoom: null, phong: false, lon: {}, xong: null, dangGui: false, daGui: 0, tong: 0, lan: [], het: false };

function batDau() {

      var u = dung_[i] !== undefined;
      h += '<button class="tile' + (u ? ' used' : '') + '" data-anh="' + i + '" aria-label="Xem tấm ' + a.so + '">' + (src(i) ? '<img alt="" loading="lazy" src="' + src(i) + '">' : '') +
        '<span class="n">#' + esc(a.so) + '</span>' + (u ? '<span class="t">' + oTen(dung_[i]) + '</span>' : '') + '</button>';
    });
    h += '</div></div><div class="foot"><div class="s"><b>' + (S.tong > 1 ? 'Combo ' + Math.min(S.daGui + 1, S.tong) + '/' + S.tong + ' · ' : '') + 'Đã chọn ' + d + '/' + tong + '</b><span class="lb">' + (d === tong ? 'Kiểm tra lại rồi bấm Gửi' : 'Còn ' + (tong - d) + ' ô trống') + '</span></div>' +
      '<button class="btn" data-k="gui"' + (d === tong && !S.dangGui ? '' : ' disabled') + '>' + (S.dangGui ? 'Đang gửi…' : 'Gửi để in') + '</button></div>';
    if (S.khungLon) h += '<div class="klon"><div class="lb">Chạm vào ô để chọn · ' + oTen(S.act) + ' đang chọn</div>' + frameHtml(Math.min(320, innerWidth - 48)) +
      '<button class="btn" data-k="dongkhung" style="min-width:160px;background:var(--the);color:var(--nau)">Xong</button></div>';
    if (S.zoom !== null) h += zoomHtml();
  }
  app.insertAdjacentHTML('beforeend', h);
  if (S.zoom !== null) zApply();
  if ($('list')) $('list').scrollTop = top;
  var m = $('main'); if (m) m.remove();
}
function zoomHtml() {
  var i = S.zoom, a = S.anh[i], act = oTen(S.act), at;
  Object.keys(S.gan).forEach(function (o) { if (S.gan[o] === i && +o < KHUNG[S.khung].o.length) at = +o; });
  var cur = S.gan[S.act];
  var note = at === undefined ? (cur !== undefined ? act + ' đang có tấm #' + S.anh[cur].so + ', sẽ thay bằng tấm này' : '') :
    (at === S.act ? 'Tấm này đang ở ' + act : 'Tấm này đang ở ' + oTen(at) + ', sẽ chuyển sang ' + act);
  if (!note) note = 'Chụm 2 ngón hoặc chạm đúp để phóng to · vuốt ngang để đổi tấm';
  return '<div class="zoom"><div class="h"><span style="font-size:15px;font-weight:500">Tấm #' + esc(a.so) + ' · ' + (i + 1) + '/' + S.anh.length + '</span>' +
    '<button data-k="dong" aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="m"><div class="zimg" id="zimg">' + (src(i) ? '<img alt="" data-k="phong" src="' + (S.lon[a.id] || src(i)) + '">' : '<div style="width:320px;height:213px"></div>') + '</div>' +
    '<button class="ar" style="left:4px" data-k="ztruoc" aria-label="Tấm trước"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>' +
    '<button class="ar" style="right:4px" data-k="zsau" aria-label="Tấm sau"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
    '<div class="f"><span>' + note + '</span><button class="btn" data-k="' + (at === S.act ? 'bo' : 'dat') + '">' + (at === S.act ? 'Bỏ khỏi ' : 'Đặt vào ') + act + '</button></div></div>';
}

// ---------- thao tác ----------
function dat(i, bo) {
  var tong = KHUNG[S.khung].o.length;
  Object.keys(S.gan).forEach(function (o) { if (S.gan[o] === i) delete S.gan[o]; });
  if (!bo) {
    S.gan[S.act] = i;
    for (var j = 1; j <= tong; j++) { var t = (S.act + j) % tong; if (S.gan[t] === undefined) { S.act = t; break; } }
  }
  S.zoom = null; S.phong = false; ve();
}
function gui() {
  var K = KHUNG[S.khung];
  var chon = K.o.map(function (_, i) { var a = S.anh[S.gan[i]]; return { o: i + 1, ten: a.ten, id: a.id }; });
  if (S.demo) { S.daGui++; S.xong = { combo: S.daGui, tong: S.tong }; ve(); return; }
  S.dangGui = true; ve();
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ a: 'gui', f: S.f, khung: S.khung, bw: S.bw, chon: chon }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { S.dangGui = false; if (!r.ok) throw new Error(r.loi); if (r.tong) S.tong = r.tong; S.daGui = Math.max(S.daGui, r.combo); S.xong = r; ve(); })
    .catch(function (e) { S.dangGui = false; ve(); alert('Chưa gửi được: ' + (e.message || e) + '. Bạn bấm Gửi lại nhé.'); });
}
// xem lớn: tải bản nét hơn (1600px) cho tấm đang xem
function moZoom(i) {
  S.zoom = i; Z = { s: 1, x: 0, y: 0 }; ve();
  var a = S.anh[i];
  if (S.demo || !a || S.lon[a.id]) return;
  // ảnh Drive 1600px (Safari/Chrome mở được; trình duyệt Instagram chặn thì giữ bản 640px)
  var u = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(a.id) + '&sz=w1600';
  var im = new Image();
  im.onload = function () {
    if (im.naturalWidth < 700) return;
    S.lon[a.id] = u;
    if (S.zoom === i) { var im0 = zImg(); if (im0) { im0.src = u; } }
  };
  im.src = u;
}
// xem lớn: chụm 2 ngón / chạm đúp để phóng to, kéo khi đang phóng, vuốt ngang khi chưa phóng để đổi tấm
var Z = { s: 1, x: 0, y: 0 };
function zImg() { var z = $('zimg'); return z && z.querySelector('img'); }
function zApply() {
  var im = zImg(); if (!im) return;
  var w = im.offsetWidth, h = im.offsetHeight;
  Z.s = Math.min(5, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(w * (1 - Z.s), Z.x));
  Z.y = Math.min(0, Math.max(h * (1 - Z.s), Z.y));
  if (Z.s === 1) { Z.x = 0; Z.y = 0; }
  im.style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')';
  var m = document.querySelector('.zoom .m'); if (m) m.classList.toggle('phong', Z.s > 1);
}
function zLocal(cx, cy) { var r = zImg().getBoundingClientRect(); return { x: cx - r.left + Z.x, y: cy - r.top + Z.y }; }
function zTo(s, cx, cy) { // phóng tới mức s, giữ nguyên điểm dưới (cx, cy)
  var c = zLocal(cx, cy), px = (c.x - Z.x) / Z.s, py = (c.y - Z.y) / Z.s;
  Z.s = s; Z.x = c.x - s * px; Z.y = c.y - s * py; zApply();
}
function phongTo(e) { zTo(Z.s > 1 ? 1 : 2.5, e.clientX, e.clientY); }
(function () {
  var g = null, lastTap = 0;
  function d(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function c(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function (e) {
    if (!e.target.closest || !e.target.closest('#zimg') || !zImg()) return;
    var t = e.touches;
    if (t.length === 2) { var m = c(t), l = zLocal(m.x, m.y); g = { pinch: true, d0: d(t), s0: Z.s, px: (l.x - Z.x) / Z.s, py: (l.y - Z.y) / Z.s, moved: true }; }
    else if (t.length === 1) g = { x0: t[0].clientX, y0: t[0].clientY, zx: Z.x, zy: Z.y, moved: false, t0: Date.now() };
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (!g) return; var t = e.touches; e.preventDefault();
    if (g.pinch && t.length === 2) {
      var m = c(t), l = zLocal(m.x, m.y);
      Z.s = Math.min(5, Math.max(1, g.s0 * d(t) / g.d0));
      Z.x = l.x - Z.s * g.px; Z.y = l.y - Z.s * g.py; zApply();
    } else if (!g.pinch && t.length === 1) {
      var dx = t[0].clientX - g.x0, dy = t[0].clientY - g.y0;
      if (Math.abs(dx) + Math.abs(dy) > 8) g.moved = true;
      if (Z.s > 1) { Z.x = g.zx + dx; Z.y = g.zy + dy; zApply(); }
      else g.dx = dx;
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!g) return;
    if (e.touches.length) { if (g.pinch) g = null; return; }
    var now = Date.now(), ch = e.changedTouches[0];
    if (!g.pinch && !g.moved) {
      if (now - lastTap < 300) { zTo(Z.s > 1 ? 1 : 2.5, ch.clientX, ch.clientY); lastTap = 0; }
      else lastTap = now;
    } else if (!g.pinch && Z.s === 1 && Math.abs(g.dx || 0) > 50) {
      moZoom((S.zoom + (g.dx < 0 ? 1 : S.anh.length - 1)) % S.anh.length);
    }
    g = null; e.preventDefault();
  }, { passive: false });
})();
document.addEventListener('click', function (e) {
  var b = e.target.closest('button,[data-k="phong"]'); if (!b) return;
  var tong = KHUNG[S.khung].o.length;
  if (b.dataset.khung) { S.khung = b.dataset.khung; S.act = 0; S.gan = {}; return ve(); }
  if (b.dataset.o) { S.act = +b.dataset.o; S.khungLon = false; return ve(); }
  if (b.dataset.anh) { moZoom(+b.dataset.anh); return; }
  switch (b.dataset.k) {
    case 'truoc': S.act = (S.act + tong - 1) % tong; return ve();
    case 'sau': S.act = (S.act + 1) % tong; return ve();
    case 'mau': S.bw = false; return ve();
    case 'td': S.bw = true; return ve();
    case 'dong': S.zoom = null; S.phong = false; return ve();
    case 'khunglon': S.khungLon = true; return ve();
    case 'dongkhung': S.khungLon = false; return ve();
    case 'phong': return phongTo(e);
    case 'ztruoc': return moZoom((S.zoom + S.anh.length - 1) % S.anh.length);
    case 'zsau': return moZoom((S.zoom + 1) % S.anh.length);
    case 'dat': return dat(S.zoom);
    case 'bo': return dat(S.zoom, true);
    case 'gui': return gui();
    case 'combo': S.xong = null; S.gan = {}; S.act = 0; return ve();
  }
});
batDau();
</script>
