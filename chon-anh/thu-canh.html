.hide{display:none!important}

    '<button data-k="dong" aria-label="' + T('dong') + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="m"><div class="zimg" id="zimg">' + (src(i) ? '<img alt="" data-k="phong" src="' + (S.lon[a.id] || src(i)) + '">' : '<div style="width:320px;height:213px"></div>') + '</div>' +
    '<button class="ar" style="left:4px" data-k="ztruoc" aria-label="' + T('tTruoc') + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>' +
    '<button class="ar" style="right:4px" data-k="zsau" aria-label="' + T('tSau') + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
    '<div class="f"><span>' + note + '</span><button class="btn" data-k="' + (at === S.act ? 'bo' : 'dat') + '">' + (at === S.act ? T('bo') : T('dat')) + act + '</button></div></div>';
}

// ---------- thao tác ----------
function dat(i, bo) {
  var tong = KHUNG[S.khung].o.length;
  Object.keys(S.gan).forEach(function (o) { if (S.gan[o] === i) delete S.gan[o]; });
  S.snk = null;
  if (!bo) {
    S.gan[S.act] = i;
    var o0 = S.act; S.snk = { o: o0 }; clearTimeout(S.snkHen); S.snkHen = setTimeout(function () { if (S.snk && S.snk.o === o0) { S.snk = null; var e = document.querySelector('.snk'); if (e) e.remove(); } }, 6000);
    for (var j = 1; j <= tong; j++) { var t = (S.act + j) % tong; if (S.gan[t] === undefined) { S.act = t; break; } }
  }
  S.zoom = null; S.phong = false; ve();
}
function gui() {
  var K = KHUNG[S.khung];
  var dong = K.o.map(function (_, i) {
    var c = catCua(i), w = cuaSo(i, c.id, c.z), f = function (v) { return Math.round(v * 100); };
    return oTen(i) + ' #' + S.anh[S.gan[i]].so + ': ngang ' + f(c.cx - w[0] / 2) + '–' + f(c.cx + w[0] / 2) + '%, dọc ' + f(c.cy - w[1] / 2) + '–' + f(c.cy + w[1] / 2) + '%' +
      (c.z > 1.01 ? ', zoom ' + c.z.toFixed(1) + '×' : '') + (S.cat[S.khung + '|' + i] && S.cat[S.khung + '|' + i].id === c.id ? ' (khách chỉnh)' : c.mat ? ' (tự căn theo mặt)' : ' (tự căn)');
  });
  toast('<b>Bản thử – không gửi in.</b> PC admin sẽ cắt ảnh gốc theo:<br>' + dong.join('<br>'));
  return;
  var chon = K.o.map(function (_, i) { var a = S.anh[S.gan[i]]; return { o: i + 1, ten: a.ten, id: a.id }; });
  if (S.demo) { S.daGui++; S.xong = { combo: S.daGui, tong: S.tong }; ve(); return; }
  S.dangGui = true; ve();
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ a: 'gui', f: S.f, khung: S.khung, bw: S.bw, chon: chon }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { S.dangGui = false; if (!r.ok) throw new Error(r.loi); if (r.tong) S.tong = r.tong; S.daGui = Math.max(S.daGui, r.combo); S.xong = r; ve(); theoDoiGhep(); })
    .catch(function (e) { S.dangGui = false; ve(); alert(T('chuaGui', loiDich(e.message || e))); });
}
// xem lớn: tải bản nét hơn (1600px) cho tấm đang xem
function moZoom(i) {
  S.zoom = i; Z = { s: 1, x: 0, y: 0 }; ve();
  var a = S.anh[i];
  if (S.demo || !a || S.lon[a.id]) return;
  // ảnh Drive 1600px (Safari/Chrome mở được; trình duyệt Instagram chặn thì giữ bản 640px)
  var u = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(a.id) + '&sz=w1600';
  var im = new Image();
  im.onload = function () {
    if (im.naturalWidth < 700) return;
    S.lon[a.id] = u;
    if (S.zoom === i) { var im0 = zImg(); if (im0) { im0.src = u; } }
  };
  im.onerror = function () { // trình duyệt trong app (Instagram...) chặn ảnh Drive -> lấy bản 1200px qua máy chủ
    goi('a=anh&f=' + encodeURIComponent(S.f) + '&s=1200&ids=' + a.id).then(function (r) {
      var b = r.anh && r.anh[a.id]; if (!b) return;
      S.lon[a.id] = b; if (S.zoom === i) { var im0 = zImg(); if (im0) im0.src = b; }
    }).catch(function () {});
  };
  im.src = u;
}
// xem lớn: chụm 2 ngón / chạm đúp để phóng to, kéo khi đang phóng, vuốt ngang khi chưa phóng để đổi tấm
var Z = { s: 1, x: 0, y: 0 };
function zImg() { var z = $('zimg'); return z && z.querySelector('img'); }
function zApply() {
  var im = zImg(); if (!im) return;
  var w = im.offsetWidth, h = im.offsetHeight;
  Z.s = Math.min(5, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(w * (1 - Z.s), Z.x));
  Z.y = Math.min(0, Math.max(h * (1 - Z.s), Z.y));
  if (Z.s === 1) { Z.x = 0; Z.y = 0; }
  im.style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')';
  var m = document.querySelector('.zoom .m'); if (m) m.classList.toggle('phong', Z.s > 1);
}
function zLocal(cx, cy) { var r = zImg().getBoundingClientRect(); return { x: cx - r.left + Z.x, y: cy - r.top + Z.y }; }
function zTo(s, cx, cy) { // phóng tới mức s, giữ nguyên điểm dưới (cx, cy)
  var c = zLocal(cx, cy), px = (c.x - Z.x) / Z.s, py = (c.y - Z.y) / Z.s;
  Z.s = s; Z.x = c.x - s * px; Z.y = c.y - s * py; zApply();
}
function phongTo(e) { zTo(Z.s > 1 ? 1 : 2.5, e.clientX, e.clientY); }
(function () {
  var g = null, lastTap = 0;
  function d(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function c(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function (e) {
    if (!e.target.closest || !e.target.closest('#zimg') || !zImg()) return;
    var t = e.touches;
    if (t.length === 2) { var m = c(t), l = zLocal(m.x, m.y); g = { pinch: true, d0: d(t), s0: Z.s, px: (l.x - Z.x) / Z.s, py: (l.y - Z.y) / Z.s, moved: true }; }
    else if (t.length === 1) g = { x0: t[0].clientX, y0: t[0].clientY, zx: Z.x, zy: Z.y, moved: false, t0: Date.now() };
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (!g) return; var t = e.touches; e.preventDefault();
    if (g.pinch && t.length === 2) {
      var m = c(t), l = zLocal(m.x, m.y);
      Z.s = Math.min(5, Math.max(1, g.s0 * d(t) / g.d0));
      Z.x = l.x - Z.s * g.px; Z.y = l.y - Z.s * g.py; zApply();
    } else if (!g.pinch && t.length === 1) {
      var dx = t[0].clientX - g.x0, dy = t[0].clientY - g.y0;
      if (Math.abs(dx) + Math.abs(dy) > 8) g.moved = true;
      if (Z.s > 1) { Z.x = g.zx + dx; Z.y = g.zy + dy; zApply(); }
      else g.dx = dx;
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!g) return;
    if (e.touches.length) { if (g.pinch) g = null; return; }
    var now = Date.now(), ch = e.changedTouches[0];
    if (!g.pinch && !g.moved) {
      if (now - lastTap < 300) { zTo(Z.s > 1 ? 1 : 2.5, ch.clientX, ch.clientY); lastTap = 0; }
      else lastTap = now;
    } else if (!g.pinch && Z.s === 1 && Math.abs(g.dx || 0) > 50) {
      moZoom((S.zoom + (g.dx < 0 ? 1 : S.anh.length - 1)) % S.anh.length);
    }
    g = null; e.preventDefault();
  }, { passive: false });
})();
document.addEventListener('click', function (e) {
  var b = e.target.closest('button,[data-k="phong"]'); if (!b) return;
  if (b.dataset.nn) return doiNN(b.dataset.nn, true);
  var tong = KHUNG[S.khung].o.length;
  if (b.dataset.khung) {  // đổi khung: giữ lại ảnh đã chọn của từng khung, bấm nhầm quay lại vẫn còn
    if (b.dataset.khung === S.khung) return;
    S.ganK[S.khung] = { gan: S.gan, act: S.act };
    var k = S.ganK[b.dataset.khung]; S.khung = b.dataset.khung; S.gan = k ? k.gan : {}; S.act = k ? k.act : 0; S.snk = null; return ve();
  }
  if (b.dataset.o) { S.act = +b.dataset.o; if ((S.khungLon || S.xem) && S.gan[S.act] !== undefined) return ceMo(S.act); if (S.xem) return ve(); S.khungLon = false; return ve(); }
  if (b.dataset.anh) { moZoom(+b.dataset.anh); return; }
  switch (b.dataset.k) {
    case 'truoc': S.act = (S.act + tong - 1) % tong; return ve();
    case 'sau': S.act = (S.act + 1) % tong; return ve();
    case 'mau': S.bw = false; return ve();
    case 'td': S.bw = true; return ve();
    case 'dong': S.zoom = null; S.phong = false; return ve();
    case 'khunglon': S.khungLon = true; return ve();
    case 'dongkhung': S.khungLon = false; return ve();
    case 'phong': return phongTo(e);
    case 'ztruoc': return moZoom((S.zoom + S.anh.length - 1) % S.anh.length);
    case 'zsau': return moZoom((S.zoom + 1) % S.anh.length);
    case 'dat': return dat(S.zoom);
    case 'bo': return dat(S.zoom, true);
    case 'gui': S.xem = true; S.snk = null; return ve();
    case 'guithat': S.xem = false; return gui();
    case 'xemdong': S.xem = false; return ve();
    case 'snkchinh': var so = S.snk.o; S.snk = null; return ceMo(so);
    case 'chinh': return ceMo(S.act);
    case 'cedong': S.ce = null; return ve();
    case 'cegiua': var c0 = catTuDong(S.ce.o, S.ce.id); S.ce.cx = c0.cx; S.ce.cy = c0.cy; S.ce.z = 1; S.ce.tay = false; return ceApply();
    case 'cexong': if (S.ce.tay) S.cat[S.khung + '|' + S.ce.o] = { id: S.ce.id, z: S.ce.z, cx: S.ce.cx, cy: S.ce.cy };
      else delete S.cat[S.khung + '|' + S.ce.o];
      S.ce = null; return ve();
    case 'luu': return luuLink();
    case 'anbar': S.anBar = true; return ve();
    case 'combo': S.xong = null; S.gan = {}; S.ganK = {}; S.act = 0; return ve();
  }
});
batDau();
