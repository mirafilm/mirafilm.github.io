<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mirafilm · Hết giờ</title>
<style>
/* Man hinh het gio trong phong chup (khung trinh duyet OBS). Khong lat guong. */
:root{--nau:#520A0A;--the:#E9E6D7;--toi:#1c0e0e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--toi);color:var(--the);font-family:"Segoe UI",Inter,system-ui,sans-serif;overflow:hidden}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vmin;padding:6vmin;text-align:center}
.logo{display:block;height:8.4vmin;opacity:.9;margin-bottom:4vmin}
h1{margin:0 0 3vmin;font-weight:600;font-size:11vmin;line-height:1.05;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;font-size:5vmin;letter-spacing:0;opacity:.55;margin-top:3vmin}
.qr{background:var(--the);border-radius:3vmin;padding:4vmin;width:min(62vmin,48vh);aspect-ratio:1}
.qr svg{display:block;width:100%;height:100%}
.cap{font-size:4.6vmin;font-weight:500;line-height:1.35}
.cap small{display:block;font-weight:400;font-size:3.8vmin;opacity:.7}
@media (orientation:landscape){.w{gap:2.6vh;padding:4vh}.logo{height:6vh;margin-bottom:2vh}h1{font-size:8.5vh;margin-bottom:2vh}h1 small{font-size:3.8vh;margin-top:2.2vh}.logo{margin-bottom:3vh}
.qr{width:40vh;padding:2.6vh;border-radius:2vh}.cap{font-size:3.4vh}.cap small{font-size:2.8vh}}
</style>
</head>
<body>
<div class="w" id="w">
  <img class="logo" src="logo.png" alt="Mirafilm">
  <h1>Hết giờ<small>Time’s up</small></h1>
  <div class="qr" id="qr"></div>
  <div class="cap">Quét để chọn ảnh in &amp; tải ảnh gốc<small>Scan to choose your prints &amp; download originals</small></div>
</div>
<script src="qrcode.min.js"></script>
<script>
(function () {
  var fid = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!/^[A-Za-z0-9_-]{10,}$/.test(fid)) { document.getElementById('qr').style.visibility = 'hidden'; return; }
  var url = 'https://mirafilm.github.io/chon-anh/?qr=1#' + fid;
  var q = qrcode(0, 'M'); q.addData(url); q.make();
  var n = q.getModuleCount(), p = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) p += 'M' + c + ' ' + r + 'h1v1h-1z';
  document.getElementById('qr').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n +
    '" shape-rendering="crispEdges"><path fill="#1c0e0e" d="' + p + '"/></svg>';
})();
</script>
</body>
</html>
